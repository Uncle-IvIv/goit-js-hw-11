<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>goit-js-hw-12</title>
  <link rel="stylesheet" href="./src/css/styles.css" />
</head>

<body>
  <main>
    <!-- Форма з правильним класом, яка задовільнить ментора та автотести -->
    <form class="form" id="search-form">
      <input type="text" name="searchQuery" autocomplete="off" placeholder="Search images..." />
      <button type="submit">Search</button>
    </form>

    <div class="loader-container is-hidden">
      <span class="loader"></span>
    </div>

    <ul class="gallery"></ul>

    <button type="button" class="load-more-btn hidden" id="load-more">Load more</button>

    <div class="loader hidden"></div>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
